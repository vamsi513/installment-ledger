name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

      # Same pinned tag as docker-compose.yml, so CI and a local run exercise
      # the same broker. Without this service tests/test_rabbit_integration.py
      # skips itself, which is exactly the hole this service closes.
      rabbitmq:
        image: rabbitmq:4.1.8-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger
      EVENTS_BROKER_URL: amqp://guest:guest@localhost:5672/

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12.15"

      - name: Install pinned dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Lint
        run: |
          ruff --version
          ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check the migration runs in both directions
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Confirm the broker is reachable
        # A skipped integration module still reports a green suite, so assert
        # the broker is there rather than discovering months later that these
        # tests have been skipping in CI all along.
        run: |
          python - <<'EOF'
          import os, sys, pika
          url = os.environ["EVENTS_BROKER_URL"]
          parameters = pika.URLParameters(url)
          parameters.socket_timeout = 5
          parameters.connection_attempts = 10
          parameters.retry_delay = 2
          try:
              pika.BlockingConnection(parameters).close()
          except Exception as exc:
              sys.exit(f"no broker at {url}: {type(exc).__name__}: {exc}")
          print(f"broker reachable at {url}")
          EOF

      - name: Test
        run: pytest

      - name: Confirm the RabbitMQ integration tests actually ran
        # `pytest` above stays green if the module skips itself, so a broken
        # broker service would look like a pass. Fail the job instead.
        run: |
          output="$(pytest tests/test_rabbit_integration.py -q --no-header -rs)"
          echo "$output"
          if echo "$output" | grep -q skipped; then
            echo "::error::the RabbitMQ integration tests skipped; the broker service was not reached"
            exit 1
          fi

  # The front end is part of this deliverable, not an optional extra like the
  # assistant, so it is a job here rather than a workflow of its own. It
  # declares no `services`: the component tests drive a stub client, so they
  # need neither Postgres nor a running API, and they make no network calls.
  # The `test` job above is untouched and stays exactly as fast as it was.
  frontend:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          # Pinned exactly, like the Python and Postgres versions above. jsdom
          # requires ^22.22.2 || ^24.15.0 || >=26.0.0, so this floor is not
          # arbitrary.
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned dependencies
        # `npm ci` installs package-lock.json exactly and fails if the lock and
        # package.json disagree, which is what `pip install -r` gives the job
        # above.
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
