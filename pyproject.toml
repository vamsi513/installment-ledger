[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

# The ledger itself is run from the working tree and installs its dependencies
# from requirements.txt, as it always has. This metadata exists so the optional
# assistant extra has somewhere to live and so `pip install -e ".[assistant]"`
# works; installing the project is not required to run the ledger or its tests.
[project]
name = "installment-ledger"
version = "0.1.0"
description = "A loan and payments API with an enforced double entry ledger."
requires-python = ">=3.12"
dynamic = ["dependencies"]

[project.optional-dependencies]
# Pinned exactly, like requirements.txt. requirements-assistant.txt holds the
# full transitive lock that CI installs.
assistant = [
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
  "mcp==2.3.0",
  "openai==3.41.0",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "websockets==17.4",
]
dev = [
  "mypy==2.4.1",
  "ruff==0.16.10",
]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["app", "app.api", "app.services", "assistant", "assistant.agent", "assistant.api", "assistant.eval", "assistant.llm", "assistant.mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# Scoped to the assistant package on purpose. The ledger predates this config
# and type checking it would mean editing files the assistant has no business
# touching.
[tool.mypy]
files = ["assistant"]
python_version = "3.12"
strict = true
warn_unused_ignores = false
pretty = true

[[tool.mypy.overrides]]
# The ledger is read, never type checked here. Its types are still used, so a
# wrong call into it is still an error in the assistant's own code.
module = ["app.*"]
follow_imports = "silent"

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain_core.*"]
ignore_missing_imports = true
follow_imports = "silent"
